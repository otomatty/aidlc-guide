# Mirror the aidlc-workflows workspace shells (.claude/ and .cursor/) when
# upstream moves.
#
# The sibling workflow, aidlc-workflows-docs-update.yml, mirrors the DOCS the
# extension bundles. This one mirrors the SHELLS this repository runs on:
# upstream's dist/claude/.claude and dist/cursor/.cursor. Nothing kept them
# current, and it matters for a reason that is easy to miss —
# packages/docs-bridge/tests/data-lint.test.ts resolves every bridge-map entry
# against .claude/aidlc-common/stages, so a stale shell means `bun run check` is
# validating yesterday's stage graph. Drift there is invisible until a user
# opens a stage the Bridge cannot explain.
#
# BOTH HARNESSES, ALWAYS. AGENTS.md opens by stating the project runs AI-DLC "in
# lockstep on two harnesses: Cursor (.cursor/) and Claude Code (.claude/)".
# Mirroring only .claude would leave Cursor on the old tools, stages, hooks and
# state graph — so the script plans both trees before writing either, and
# refuses outright if upstream ships them at different versions.
#
# NOT A USER-VISIBLE RELEASE, hence release:skip. Neither tree is shipped: the
# VSIX packages only dist/ and media/ (.vscodeignore), and at runtime docs-bridge
# resolves doc paths against the USER's docsRepoPath. The pin users actually see
# is docs/official-docs.manifest.json, which the docs workflow moves. Relabel
# this PR only if you land user-visible work on its branch.
#
# THE GATE DOES NOT BLOCK THE PR, unlike the docs sync. There, a broken mirror is
# a bug in the mirror and must not reach a reviewer. Here a red gate is the
# expected outcome of a real upstream change — most reliably because the mirror
# overwrites .cursor/hooks/aidlc-cursor-adapter.ts, which this repository patches
# (PR #43) and re-applies on every engine upgrade. Losing that patch is caught by
# the repo's own aidlc-cursor-adapter.test.ts rather than passing silently, and
# re-applying it is what the PR is for. So the gate runs, its result goes in the
# body, and a failing gate opens the PR as a draft instead of suppressing it.
#
# TWO JOBS, AND THE SPLIT IS THE SECURITY BOUNDARY. `build` runs everything that
# executes code — bun install, the mirror, `bun run check` — under contents:
# read, and hands `publish` a patch. `publish` holds the write token and runs no
# repository code at all: it checks out, applies the patch, opens the PR and
# labels it. That split exists because this workflow copies external TypeScript
# into the tree and then runs the gate over it, and the gate DOES reach .cursor:
# vitest globs .cursor/hooks/**/*.test.ts, and the repo's adapter test imports
# upstream's aidlc-cursor-adapter.ts. Running that under a write token is what
# the boundary prevents. Do not merge these jobs back together.
#
# THE PATCH IS UNTRUSTED, because it is built by the job that ran that code. Two
# guards, on both sides: `build` resets the index before staging, so nothing the
# gate happened to stage can ride along (`git add -- <pathspec>` adds paths, it
# does not clear ones already staged, and the diff would have serialised them);
# and `publish` re-reads the patch with `git apply --numstat` and refuses it
# outright if any path falls outside .claude/ and .cursor/. The second check is
# the load-bearing one -- it does not depend on the unprivileged job having been
# careful.
#
# Everything else follows the docs workflow: main-only (workflow_dispatch can
# name any ref), the upstream branch is resolved rather than pinned (upstream
# renamed v2 to main once already), and the sync branch is left alone while it
# carries commits this workflow did not make, so a reviewer's fixes are never
# force-pushed away.
#
# NOT YET VERIFIED end-to-end: a workflow only takes effect once it is on the
# default branch. Treat the first scheduled run as an acceptance check, and use
# workflow_dispatch to trigger it deliberately rather than waiting for 03:30.
name: aidlc-workflows-shell-update

on:
  schedule:
    # Half an hour after the docs sync, so the two never contend for the same
    # upstream clone minute and the summaries read in a predictable order.
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SYNC_BRANCH: chore/aidlc-workflows-shell
  # No branch name here on purpose: upstream's default branch moved v2 -> main
  # at GA. The resolve step asks the remote for its HEAD symref.
  UPSTREAM_GIT_URL: https://github.com/awslabs/aidlc-workflows.git

# One sync at a time. cancel-in-progress: false because a half-applied mirror
# is worse than a late one.
concurrency:
  group: aidlc-workflows-shell-update
  cancel-in-progress: false

jobs:
  # Everything that runs code. No write token anywhere in this job.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The hold-back guard asks which commits are on the sync branch.
      pull-requests: read
    outputs:
      held: ${{ steps.guard.outputs.held }}
      changed: ${{ steps.sync.outputs.changed }}
      version: ${{ steps.sync.outputs.version }}
      sha: ${{ steps.clone.outputs.sha }}
      branch: ${{ steps.upstream.outputs.branch }}
      gate: ${{ steps.gate.outcome }}

    steps:
      # Runs before checkout, so no repository code executes first. Same stance
      # as release.yml and the docs sync: main only, and say so rather than
      # quietly do nothing. This job holds no write token, but `publish` keys
      # off its outputs, so the guard belongs at the front of the chain.
      - name: Refuse to sync from a ref other than main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the shell sync runs from main only (got ${GITHUB_REF})"
            exit 1
          fi

      # Ask the remote which branch it calls default, because that is what
      # follows a rename (upstream merged v2 into main and HEAD moved with it).
      # Same single-symref resolution the docs sync uses.
      - name: Resolve the upstream branch
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          branch=$(git ls-remote --symref "$UPSTREAM_GIT_URL" HEAD \
            | awk '$1 == "ref:" { sub("refs/heads/", "", $2); print $2; exit }')
          if [ -z "$branch" ]; then
            echo "::error::could not resolve the upstream default branch (${UPSTREAM_GIT_URL})"
            exit 1
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "upstream default branch: ${branch}" >> "$GITHUB_STEP_SUMMARY"

      # Pinned to the exact commit, not the branch tip: `publish` checks out the
      # same sha and applies a patch generated here, so the two must agree even
      # if main moves between the jobs.
      #
      # persist-credentials: false because this is the job that runs upstream
      # code. The default checkout writes GITHUB_TOKEN into .git/config, i.e.
      # into the very worktree `bun run check` then executes upstream's Cursor
      # adapter from. The token is only contents/pull-requests read, and this
      # job never pushes, so there is nothing to lose by withholding it -- which
      # is exactly the argument for withholding it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # Unlike the docs sync there is no SHA pin to compare: the shell mirror is
      # content-addressed, so "is a sync needed" is answered by planning it.
      # What still needs asking up front is whether someone is working on the
      # open sync PR — create-pull-request rebuilds the branch from main plus
      # this run's patch, which would force-push a reviewer's re-applied adapter
      # patch away. Only while a PR is actually OPEN: a squash merge makes none
      # of the branch's commits ancestors of main, so with delete-branch false
      # the comparison would otherwise report that commit forever and freeze the
      # sync permanently.
      - name: Hold back while the sync branch carries someone else's work
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # --exit-code returns 2 for "no such branch" and something else for a
          # real failure. Treating every non-zero as "no branch" would let a
          # transient git error rewrite an open PR — exactly what this prevents.
          set +e
          git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1
          lookup=$?
          set -e
          if [ "$lookup" -eq 2 ]; then
            echo "held=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$lookup" -ne 0 ]; then
            echo "::error::could not query ${SYNC_BRANCH} (git ls-remote exit ${lookup})"
            exit 1
          fi
          open_prs=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'length')
          if [ -z "$open_prs" ]; then
            echo "::error::could not query open PRs for ${SYNC_BRANCH}"
            exit 1
          fi
          if [ "$open_prs" = "0" ]; then
            echo "held=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          human_commits=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SYNC_BRANCH}" --jq '
            [ .commits[]
              | select((.committer.login // "") != "github-actions[bot]")
              | select((.commit.committer.email // "")
                  | endswith("github-actions[bot]@users.noreply.github.com") | not)
            ] | length')
          if [ -z "$human_commits" ]; then
            echo "::error::could not inspect ${SYNC_BRANCH} for non-workflow commits"
            exit 1
          fi
          if [ "$human_commits" != "0" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${SYNC_BRANCH} carries ${human_commits} commit(s) this workflow did not make; not touching it. Merge or close the open sync PR to pick up the next upstream move."
            echo "held back: ${human_commits} non-workflow commit(s) on ${SYNC_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "held=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone the upstream shells
        if: steps.guard.outputs.held == 'false'
        id: clone
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/aidlc-workflows"
          rm -rf "$dir"
          # Blobless but NOT shallow, as in the docs sync: the ancestry gate
          # below needs a commit graph. ~5 MB instead of ~1 MB, same wall time.
          git clone --filter=blob:none --sparse --branch "$UPSTREAM_BRANCH" \
            "$UPSTREAM_GIT_URL" "$dir"
          # Both harness trees. Fetching only one would make the mirror refuse
          # (it needs both) rather than silently split lockstep.
          git -C "$dir" sparse-checkout set dist/claude/.claude dist/cursor/.cursor
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C "$dir" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # This workflow keeps no pin of its own -- the shell mirror is
      # content-addressed. It borrows the docs manifest's, which tracks the same
      # upstream revision line, purely to answer "is the branch we resolved by
      # name the continuation of what we have been mirroring?". Advisory only:
      # this PR is release:skip in every case, so the finding goes in the body.
      - name: Check the resolved branch continues the pinned revision
        if: steps.guard.outputs.held == 'false'
        id: ancestry
        shell: bash
        env:
          UPSTREAM_DIR: ${{ steps.clone.outputs.dir }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          pin=$(jq -r '.upstreamSha // ""' docs/official-docs.manifest.json)
          if [ -z "$pin" ]; then
            echo "result=no-pin" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 0 ancestor, 1 not an ancestor, 128 the commit is unknown here.
          set +e
          git -C "$UPSTREAM_DIR" merge-base --is-ancestor "$pin" HEAD 2>/dev/null
          status=$?
          set -e
          case "$status" in
            0) result=ok ;;
            1) result=diverged ;;
            *) result=unknown ;;
          esac
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "ancestry: ${pin} vs ${UPSTREAM_BRANCH} -> ${result}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" != "ok" ]; then
            echo "::warning::the pinned revision ${pin} is not behind ${UPSTREAM_BRANCH} (${result}); mirroring the shells anyway"
          fi

      # Before the sync: both scripts import packages/*/src, which resolves
      # `@aidlc-guide/shared-types` through the workspace symlinks bun install
      # creates. A fresh checkout has no node_modules.
      - name: Install dependencies
        if: steps.guard.outputs.held == 'false'
        run: bun install --frozen-lockfile

      # Read BEFORE the mirror runs: the check compares upstream against this
      # repository's hand-maintained maps, and those are what the reviewer has to
      # update. Running it after would report the same thing, but the shells on
      # disk would already have moved under it.
      #
      # continue-on-error: the check reads an upstream layout it does not
      # control, and a restructure that makes it throw must not also stop the
      # mirror. The step after it makes the failure visible in the PR.
      - name: Check what else these shells need by hand
        if: steps.guard.outputs.held == 'false'
        id: drift
        continue-on-error: true
        shell: bash
        env:
          UPSTREAM_DIR: ${{ steps.clone.outputs.dir }}
        run: |
          set -euo pipefail
          bun scripts/check-workflows-drift.ts \
            --upstream "$UPSTREAM_DIR" \
            --out "${RUNNER_TEMP}/drift.md" \
            | tee "${RUNNER_TEMP}/drift-output.txt"
          cat "${RUNNER_TEMP}/drift-output.txt" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/drift.md" >> "$GITHUB_STEP_SUMMARY"

      # The body composer cats this file unconditionally, so it has to exist
      # even when the check could not produce it -- and saying nothing would
      # read as "checked, nothing found".
      - name: Note a compatibility check that could not run
        if: steps.guard.outputs.held == 'false' && steps.drift.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## aidlc-workflows 互換性チェック"
            echo
            echo "> [!WARNING]"
            echo "> チェックを実行できませんでした（Actions のログを参照）。State Version・bridge-map・agent-map・stage-map の追随は**手で**確認してください。"
          } > "${RUNNER_TEMP}/drift.md"
          echo "::warning::the compatibility check failed; this sync PR carries no findings"

      - name: Mirror both shells
        if: steps.guard.outputs.held == 'false'
        id: sync
        shell: bash
        env:
          UPSTREAM_DIR: ${{ steps.clone.outputs.dir }}
          UPSTREAM_SHA: ${{ steps.clone.outputs.sha }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          bun scripts/sync-workflows-shell.ts \
            --upstream "$UPSTREAM_DIR" \
            --upstream-sha "$UPSTREAM_SHA" \
            --pr-body "${RUNNER_TEMP}/pr-body.md" \
            | tee "${RUNNER_TEMP}/sync-output.txt"
          cat "${RUNNER_TEMP}/sync-output.txt" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/sync-output.txt" >> "$GITHUB_STEP_SUMMARY"

      # continue-on-error: a red gate here is usually the upstream change asking
      # for hand work (most often the overwritten Cursor adapter patch), not a
      # broken mirror. It decides draft vs ready, and its tail goes in the body.
      - name: Quality gate
        if: steps.guard.outputs.held == 'false' && steps.sync.outputs.changed == 'true'
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          bun run check 2>&1 | tee "${RUNNER_TEMP}/gate.log"

      - name: Compose the PR body
        if: steps.guard.outputs.held == 'false' && steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          ANCESTRY: ${{ steps.ancestry.outputs.result }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/pr-body.md"
          {
            echo
            cat "${RUNNER_TEMP}/drift.md"
            if [ "$ANCESTRY" != "ok" ] && [ "$ANCESTRY" != "no-pin" ] && [ -n "$ANCESTRY" ]; then
              echo
              echo "> [!CAUTION]"
              echo "> ピン留めしていたリビジョンが \`${UPSTREAM_BRANCH}\` の履歴上にありません（\`${ANCESTRY}\`）。upstream が履歴を書き換えたか、別の系統のブランチを見ています。下のシェル差分の大きさで判断してください。"
            fi
            echo
            echo "## Quality gate (\`bun run check\`)"
            echo
            if [ "$GATE_OUTCOME" = "success" ]; then
              echo "✅ 通過。"
            else
              echo "❌ 失敗。この PR は draft で開いています。上のチェックリストに対応してから ready にしてください。"
              echo
              echo "<details><summary>最後の 100 行</summary>"
              echo
              echo '```'
              tail -n 100 "${RUNNER_TEMP}/gate.log" | sed 's/```/ʼʼʼ/g'
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$body"

      # The handoff to the privileged job: a patch rather than a checkout it has
      # to reproduce. `git add -A` stages deletions too, so the patch carries
      # everything the mirror did -- including a file upstream removed, which a
      # plain artifact of the trees could not express.
      - name: Package the mirror as a patch
        if: steps.guard.outputs.held == 'false' && steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # RESET FIRST. `bun run check` ran upstream code a step ago (the repo's
          # .cursor adapter test imports upstream's adapter), and anything it
          # staged would still be in the index here: `git add -- <pathspec>`
          # adds paths, it does not clear ones already staged, and the
          # `git diff --cached` below would serialise them into the patch that
          # crosses into the privileged job. Reset, then stage only the two
          # harness trees, then diff with the same pathspec.
          git reset -q
          git add -A -- .claude .cursor
          git diff --cached --binary -- .claude .cursor > "${RUNNER_TEMP}/shell.patch"
          if [ ! -s "${RUNNER_TEMP}/shell.patch" ]; then
            echo "::error::the mirror reported changes but produced an empty patch"
            exit 1
          fi
          wc -l < "${RUNNER_TEMP}/shell.patch" | xargs -I{} echo "patch lines: {}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the patch and PR body
        if: steps.guard.outputs.held == 'false' && steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shell-sync
          path: |
            ${{ runner.temp }}/shell.patch
            ${{ runner.temp }}/pr-body.md
          retention-days: 1
          if-no-files-found: error

  # Holds the write token and runs NO repository code: checkout, apply, open,
  # label. Nothing here executes anything the mirror brought in from upstream.
  publish:
    needs: build
    if: needs.build.outputs.held == 'false' && needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      # Labels live under the Issues API. Needed only to create release:skip on
      # demand -- it is referenced all through the release tooling but has never
      # existed as a repository label, so adding it would otherwise fail.
      issues: write

    steps:
      # The same commit `build` patched, so the patch applies cleanly even if
      # main moved while the gate was running.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: shell-sync
          path: ${{ runner.temp }}/shell-sync

      # The patch is the one thing that crosses from the unprivileged job into
      # this one, so it is validated HERE rather than trusted to have been built
      # carefully. `build` runs upstream code, so treat its output as untrusted:
      # check every path the patch touches before applying anything.
      - name: Refuse a patch that reaches outside the harness trees
        shell: bash
        run: |
          set -euo pipefail
          patch="${RUNNER_TEMP}/shell-sync/shell.patch"
          # --numstat lists every path the patch touches, including renames,
          # without applying it. Anything not under the two mirrored trees means
          # the patch is not what this workflow is for.
          outside=$(git apply --numstat -- "$patch" \
            | cut -f3- \
            | grep -Ev '^\.(claude|cursor)/' || true)
          if [ -n "$outside" ]; then
            echo "::error::the shell patch touches paths outside .claude/ and .cursor/; refusing to apply it"
            printf '%s\n' "$outside" | head -50
            exit 1
          fi

      - name: Apply the mirror
        shell: bash
        run: |
          set -euo pipefail
          # --index so deletions and additions are staged exactly as build saw
          # them; create-pull-request then commits the paths below.
          git apply --index --binary "${RUNNER_TEMP}/shell-sync/shell.patch"
          git status --short -- .claude .cursor | head -20 >> "$GITHUB_STEP_SUMMARY"

      # add-paths keeps the commit to the two harness trees: nothing else in the
      # worktree can ride along. A reviewer's own fixes are their commits.
      - name: Open or update the sync PR
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: false
          # always-true, not true: the action documents `true` as create-only,
          # and this PR is long-lived. A sync that opened green and was later
          # rebuilt by a further upstream move can turn the gate red, and `true`
          # would leave that PR sitting in the ready state -- mergeable despite
          # a failed gate, with no separate check run to contradict it, since a
          # GITHUB_TOKEN PR does not start check.yml.
          draft: ${{ needs.build.outputs.gate != 'success' && 'always-true' || 'false' }}
          # Pinned, not left to the action's default: the guard step decides
          # whether to hold back by asking which commits this workflow did not
          # make, so that identity is load-bearing here.
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          add-paths: |
            .claude
            .cursor
          title: "chore(shell): sync aidlc-workflows harnesses to ${{ needs.build.outputs.version }}"
          commit-message: |
            chore(shell): sync aidlc-workflows harnesses to ${{ needs.build.outputs.version }}

            Mirror awslabs/aidlc-workflows ${{ needs.build.outputs.branch }} (${{ needs.build.outputs.sha }})
            dist/claude/.claude and dist/cursor/.cursor, in lockstep. Fixture
            only: neither tree is shipped in the VSIX.
          body-path: ${{ runner.temp }}/shell-sync/pr-body.md

      # Always release:skip, and applied on update as well as create -- unlike
      # the docs sync, where the label is the ship decision a reviewer may edit.
      # Here patch is the unlabelled default, so an unlabelled shell PR would
      # ship a release for files users never receive. A reviewer who lands
      # user-visible work on this branch swaps the label deliberately; the next
      # upstream move cannot reach the branch to undo that, because the guard
      # step holds back the moment their commit is on it.
      - name: Label the sync PR release:skip
        if: steps.pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # release:skip is documented by scripts/bump-extension-version.ts as
          # the opt-out but has never been created as a repository label, so
          # --add-label would fail on "label not found". Create it if missing;
          # no --force, so a colour or description someone chose is kept.
          gh label create release:skip \
            --color "B60205" \
            --description "Merge to main neither bumps the extension version nor publishes a release" \
            2>/dev/null || true
          for attempt in 1 2 3; do
            if gh pr edit "$PR_NUMBER" --add-label release:skip; then
              exit 0
            fi
            echo "label attempt ${attempt} failed" >> "$GITHUB_STEP_SUMMARY"
            sleep $((attempt * 5))
          done
          echo "::error::could not label PR #${PR_NUMBER} release:skip; merging it would ship a patch release (the unlabelled default) for a change users never receive. Label it by hand before merging."
          exit 1
