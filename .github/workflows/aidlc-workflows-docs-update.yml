# Mirror the bundled aidlc-workflows docs snapshot when upstream moves.
#
# The snapshot under docs/<section>/en is a verbatim copy of the whole
# awslabs/aidlc-workflows docs/ tree — its four section directories plus the
# loose docs-root pages, which land under docs/overview/en — pinned by
# docs/official-docs.manifest.json. Nothing kept it current, so the pin drifted
# by hand. This job watches the upstream tip SHA and opens a PR when it moves.
#
# THE UPSTREAM BRANCH IS RESOLVED, NOT PINNED. This job originally hard-coded
# `v2`. Upstream then renamed that branch to `main` (the old tip survives as
# `v2_backup`, and the pinned SHA is an ancestor of main), at which point
# `git ls-remote refs/heads/v2` returned nothing and every scheduled run failed
# on "could not read the upstream tip". A rename must not silently stop the
# sync, so UPSTREAM_BRANCHES lists candidates in preference order and the first
# one that exists wins. Add to the list rather than replacing it — a candidate
# that no longer exists costs one extra ls-remote.
#
# Upstream tags lag the shipped versions (v2.3.0 while 2.6.x was current), so
# the tip SHA — not a tag or the version string — is the only reliable change
# signal. The pin therefore records upstreamSha; a manifest without one (every
# pin written before this workflow existed) reads as "never synced" and the
# first run establishes the baseline.
#
# The compatibility check (scripts/check-workflows-drift.ts) runs alongside the
# mirror and reports what ELSE this pin needs by hand: the State Version the
# reader parser accepts, the per-stage and per-agent docs-bridge maps, and the
# stage-map deep links. Its findings ride in the PR body. One of them is
# blocking: a State Version outside the set the extension supports flips the label
# from release:patch to release:skip, so a pin that would leave installed
# extensions showing "unsupported" cannot ship by merging alone.
#
# ja is hand-written and this job never authors a translation: it only removes a
# ja page whose English original upstream deleted, and fails loud if the tree
# drifts any other way. Reviewing the translation work is what the PR is for —
# the diff report in the body lists every page that now needs one.
#
# The gate runs HERE, not on the PR. check.yml does not run unattended on a PR
# opened with GITHUB_TOKEN: GitHub's docs describe the runs as created in an
# approval-required state, peter-evans/create-pull-request documents them as not
# triggered at all, and either way no result arrives without a human. So this job
# runs `bun run check` itself and a mirror that breaks the snapshot never reaches
# a PR. Two consequences worth knowing: the sync PR may show no check run to
# approve, and if check.yml is a REQUIRED status check the PR cannot merge until
# someone approves or re-runs it. Pass a PAT or GitHub App installation token as
# the `token:` input of the create-pull-request step to make the PR's own checks
# run by themselves.
#
# One job holds the write token while running bun, which release.yml and
# bump-extension-version.yml deliberately avoid. Their threat is a PR author
# replacing a script that then runs with write access; this workflow has no PR
# trigger, and the ref guard below pins every run to main -- schedule always
# runs default-branch code, but a dispatch can name any ref. The untrusted input
# here is upstream markdown, which is copied and read, never executed.
#
# NOT YET VERIFIED end-to-end: a workflow only takes effect once it is on the
# default branch. Treat the first scheduled run as an acceptance check, and use
# workflow_dispatch to trigger it deliberately rather than waiting for 03:00.
name: aidlc-workflows-docs-update

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  SYNC_BRANCH: chore/aidlc-workflows-docs
  # Preference order; the first branch that exists upstream is the one synced.
  UPSTREAM_BRANCHES: "main v2"

# One sync at a time. cancel-in-progress: false because a half-applied mirror
# is worse than a late one.
concurrency:
  group: aidlc-workflows-docs-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Labels live under the Issues API. Needed only to create release:skip on
      # demand -- it is referenced all through the release tooling but has never
      # existed as a repository label, so adding it would otherwise fail.
      issues: write

    steps:
      # workflow_dispatch can be launched against ANY ref once this file is on
      # main, and this job holds contents: write -- so without the guard a
      # dispatch from a feature branch would run that branch's scripts/ with a
      # write token and push its output to the sync branch. Same stance as
      # release.yml: main only, and say so rather than quietly do nothing.
      # Runs before checkout, so no repository code executes first.
      - name: Refuse to sync from a ref other than main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::the docs sync runs from main only (got ${GITHUB_REF})"
            exit 1
          fi

      # Before checkout, like the guard: no repository code runs first, and a
      # rename that leaves no candidate must fail loud rather than reach the
      # compare step with an empty ref and read as "upstream is unavailable".
      # Ask the remote which branch it considers default, rather than guessing
      # from a name. That is what actually follows a rename: when upstream
      # merged v2 into main, HEAD moved with it on the same day. The candidate
      # list below is only the fallback for a server that answers no symref.
      #
      # Resolution is by NAME, so it cannot tell "v2 was renamed to main" from
      # "main is a different line of development" -- the ancestry gate after the
      # clone is what answers that.
      - name: Resolve the upstream branch
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          branch=$(git ls-remote --symref https://github.com/awslabs/aidlc-workflows.git HEAD \
            | sed -n 's#^ref: refs/heads/\([^\t]*\)\tHEAD$#\1#p')
          if [ -n "$branch" ]; then
            echo "branch=${branch}" >> "$GITHUB_OUTPUT"
            echo "upstream branch: ${branch} (remote HEAD)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::the upstream remote answered no symbolic HEAD; falling back to the candidate list"
          for candidate in $UPSTREAM_BRANCHES; do
            if git ls-remote --exit-code --heads \
              https://github.com/awslabs/aidlc-workflows.git "$candidate" >/dev/null 2>&1; then
              echo "branch=${candidate}" >> "$GITHUB_OUTPUT"
              echo "upstream branch: ${candidate} (candidate list)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "::error::could not resolve an upstream branch: remote HEAD is not symbolic and none of ${UPSTREAM_BRANCHES} exist"
          exit 1

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      # Cheap gate: one ls-remote, no clone. Runs daily and does nothing on
      # almost every run.
      - name: Compare the pinned SHA against the upstream tip
        id: compare
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          pin=$(jq -r '.upstreamSha // ""' docs/official-docs.manifest.json)
          # While a sync PR sits open, main still carries the OLD pin, so
          # comparing against main alone would re-sync every single day and
          # rewrite the branch -- capturedAt and the report timestamp come from
          # the clock, so each run would churn the PR's review and check state
          # with no upstream change behind it. The open branch's own pin is the
          # honest baseline. (A sync PR closed without merging therefore stays
          # closed until upstream moves again; delete the branch to re-open one.)
          # --exit-code returns 2 for "no such branch" and something else for a
          # real failure. Treating every non-zero as "no branch" would let a
          # transient git error fall back to main's pin and rewrite the open
          # PR -- exactly the churn this lookup exists to prevent.
          set +e
          git ls-remote --exit-code --heads origin "$SYNC_BRANCH" >/dev/null 2>&1
          lookup=$?
          set -e
          human_commits=0
          if [ "$lookup" -eq 0 ]; then
            git fetch --depth 1 origin "$SYNC_BRANCH"
            branch_pin=$(git show FETCH_HEAD:docs/official-docs.manifest.json | jq -r '.upstreamSha // ""')
            if [ -n "$branch_pin" ]; then
              echo "sync branch pins ${branch_pin}" >> "$GITHUB_STEP_SUMMARY"
              pin="$branch_pin"
            fi
            # The PR body asks reviewers to add ja translations ON THIS BRANCH,
            # and an update rebuilds it from main -- so a later upstream move
            # would rewrite the branch under someone mid-translation, at best
            # replacing their diff and at worst dropping their commits. While
            # any commit here is not this workflow's own, leave the branch
            # alone; the newer upstream tip is picked up once the PR lands.
            #
            # Only while a PR is actually OPEN on the branch. A squash merge --
            # this repository's landing path -- makes none of the branch's
            # commits ancestors of main, so with delete-branch false the compare
            # below would keep reporting the translator's commit long after it
            # landed and freeze the sync permanently.
            open_prs=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq 'length')
            if [ -z "$open_prs" ]; then
              echo "::error::could not query open PRs for ${SYNC_BRANCH}"
              exit 1
            fi
            if [ "$open_prs" != "0" ]; then
              human_commits=$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${SYNC_BRANCH}" --jq '
                [ .commits[]
                  | select((.committer.login // "") != "github-actions[bot]")
                  | select((.commit.committer.email // "")
                      | endswith("github-actions[bot]@users.noreply.github.com") | not)
                ] | length')
              if [ -z "$human_commits" ]; then
                echo "::error::could not inspect ${SYNC_BRANCH} for non-workflow commits"
                exit 1
              fi
            fi
          elif [ "$lookup" -ne 2 ]; then
            echo "::error::could not query ${SYNC_BRANCH} (git ls-remote exit ${lookup})"
            exit 1
          fi
          tip=$(git ls-remote https://github.com/awslabs/aidlc-workflows.git \
            "refs/heads/${UPSTREAM_BRANCH}" | cut -f1)
          if [ -z "$tip" ]; then
            echo "::error::could not read the upstream ${UPSTREAM_BRANCH} tip"
            exit 1
          fi
          echo "tip=${tip}" >> "$GITHUB_OUTPUT"
          if [ "$pin" = "$tip" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "already pinned to ${pin}" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$human_commits" != "0" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::${SYNC_BRANCH} carries ${human_commits} commit(s) this workflow did not make; not touching it. Merge or close the open sync PR to pick up ${tip}."
            echo "held back: ${human_commits} non-workflow commit(s) on ${SYNC_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "pin ${pin:-<none>} -> ${tip}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # docs/ is what gets mirrored; dist/claude/.../aidlc-version.ts is where
      # upstream records AIDLC_VERSION, which becomes the new pin the extension
      # compares a user's workspace against.
      - name: Clone the upstream docs tree
        if: steps.compare.outputs.needed == 'true'
        id: clone
        shell: bash
        env:
          TIP: ${{ steps.compare.outputs.tip }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/aidlc-workflows"
          rm -rf "$dir"
          # Blobless but NOT shallow: --depth 1 leaves no commit graph, and the
          # ancestry gate below needs one to ask whether the pinned revision is
          # behind this branch. Measured on this repository: same wall time,
          # ~5 MB instead of ~1 MB for 452 commits.
          git clone --filter=blob:none --sparse --branch "$UPSTREAM_BRANCH" \
            https://github.com/awslabs/aidlc-workflows.git "$dir"
          # The whole shell, not just tools/: the compatibility check reads the
          # stage graph under aidlc-common/stages and the personas under agents/,
          # and a sparse set that misses them makes it report every stage as
          # removed upstream.
          git -C "$dir" sparse-checkout set docs dist/claude/.claude
          # Upstream can move between the ls-remote above and this clone. Record
          # what was actually synced, not what was advertised.
          head=$(git -C "$dir" rev-parse HEAD)
          if [ "$head" != "$TIP" ]; then
            echo "${UPSTREAM_BRANCH} moved ${TIP} -> ${head} during the run; pinning ${head}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"
          echo "sha=${head}" >> "$GITHUB_OUTPUT"

      # Is the branch we resolved by NAME actually the continuation of what this
      # repository has been mirroring? When upstream merged v2 into main, it was
      # -- the pinned revision is an ancestor of main. Had `main` instead been a
      # different line (upstream also carries v1), name resolution would have
      # happily mirrored it and re-pinned, and the only evidence would have been
      # a very large diff nobody was primed to distrust.
      #
      # Four outcomes, and only two of them are "carry on":
      #   ok       — the pin is behind this branch; a normal move.
      #   no-pin   — nothing mirrored yet; the first run establishes a baseline.
      #   diverged — the pin is NOT on this branch. Either upstream rewrote
      #              history, or we are looking at the wrong branch.
      #   unknown  — the pinned commit is not in this branch's history at all
      #              (rewritten and collected, or a bad pin).
      # The last two do not stop the mirror -- a reviewer is better served by
      # seeing the diff than by a job that quietly fails every night, which is
      # how the v2 rename went unnoticed. They do stop it SHIPPING: the label
      # step turns them into release:skip.
      - name: Check the resolved branch continues the pinned revision
        if: steps.compare.outputs.needed == 'true'
        id: ancestry
        shell: bash
        env:
          UPSTREAM_DIR: ${{ steps.clone.outputs.dir }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          pin=$(jq -r '.upstreamSha // ""' docs/official-docs.manifest.json)
          if [ -z "$pin" ]; then
            echo "result=no-pin" >> "$GITHUB_OUTPUT"
            echo "ancestry: no previous pin to compare against" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Three exit statuses, not two: 0 ancestor, 1 not an ancestor, 128 the
          # commit is unknown to this clone. Folding 128 into "diverged" would
          # report a missing commit as a branch conflict.
          set +e
          git -C "$UPSTREAM_DIR" merge-base --is-ancestor "$pin" HEAD 2>/dev/null
          status=$?
          set -e
          case "$status" in
            0) result=ok ;;
            1) result=diverged ;;
            *) result=unknown ;;
          esac
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "ancestry: ${pin} vs ${UPSTREAM_BRANCH} -> ${result}" >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" != "ok" ]; then
            echo "::warning::the pinned revision ${pin} is not behind ${UPSTREAM_BRANCH} (${result}); mirroring anyway, but this PR will be labelled release:skip"
          fi

      # Before the sync, not after it: sync-official-docs.ts imports
      # packages/official-docs/src, which resolves `@aidlc-guide/shared-types`
      # through the workspace symlinks `bun install` creates. A fresh checkout
      # has no node_modules, so running the mirror first fails on module
      # resolution before it reads a single page.
      - name: Install dependencies
        if: steps.compare.outputs.needed == 'true'
        run: bun install --frozen-lockfile

      # Advisory by design: findings are data the reviewer acts on, not a reason
      # to abandon the mirror. The one that bites is state_version_supported —
      # the label step below reads it.
      #
      # continue-on-error for the same reason the findings are advisory: the
      # check reads an upstream layout it does not control, and a restructure
      # that makes it throw must not also stop the docs mirror, which is useful
      # on its own. The step after this one makes the failure visible in the PR.
      - name: Check what else this pin needs by hand
        if: steps.compare.outputs.needed == 'true'
        id: drift
        continue-on-error: true
        shell: bash
        env:
          UPSTREAM_DIR: ${{ steps.clone.outputs.dir }}
        run: |
          set -euo pipefail
          bun scripts/check-workflows-drift.ts \
            --upstream "$UPSTREAM_DIR" \
            --out "${RUNNER_TEMP}/drift.md" \
            | tee "${RUNNER_TEMP}/drift-output.txt"
          cat "${RUNNER_TEMP}/drift-output.txt" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/drift.md" >> "$GITHUB_STEP_SUMMARY"

      # The mirror passes --extra-section unconditionally, so the file has to
      # exist even when the check could not produce it. Saying nothing would
      # read as "checked, nothing found", which is the one thing it must not
      # look like.
      - name: Note a compatibility check that could not run
        if: steps.compare.outputs.needed == 'true' && steps.drift.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## aidlc-workflows 互換性チェック"
            echo
            echo "> [!WARNING]"
            echo "> チェックを実行できませんでした（Actions のログを参照）。State Version・bridge-map・agent-map・stage-map の追随は**手で**確認してください。"
            echo ">"
            echo "> 検証されていないものは出荷しないため、この PR は \`release:skip\` が付きます。手で確認したうえで問題なければラベルを貼り替えてください。"
          } > "${RUNNER_TEMP}/drift.md"
          echo "::warning::the compatibility check failed; this sync PR carries no findings and is labelled release:skip"

      # Prepended, not appended: this is the first thing a reviewer has to see,
      # because it says the diff below may not be an upstream release at all.
      - name: Lead the PR body with an unexplained upstream move
        if: >-
          steps.compare.outputs.needed == 'true'
          && steps.ancestry.outputs.result != 'ok'
          && steps.ancestry.outputs.result != 'no-pin'
        shell: bash
        env:
          ANCESTRY: ${{ steps.ancestry.outputs.result }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          note="${RUNNER_TEMP}/ancestry.md"
          {
            echo "> [!CAUTION]"
            if [ "$ANCESTRY" = "diverged" ]; then
              echo "> ピン留めしていたリビジョンが \`${UPSTREAM_BRANCH}\` の履歴上にありません。upstream が履歴を書き換えたか、**別の系統のブランチを見ています**。下の差分が想定より大きい場合は後者を疑ってください。"
            else
              echo "> ピン留めしていたリビジョンが \`${UPSTREAM_BRANCH}\` の履歴から見つかりません（書き換えられて回収されたか、ピンが不正）。下の差分の出所を確認してください。"
            fi
            echo ">"
            echo "> この PR は \`release:skip\` が付きます。内容を確認したうえで、出荷してよければラベルを貼り替えてください。"
            echo
            cat "${RUNNER_TEMP}/drift.md"
          } > "$note"
          mv "$note" "${RUNNER_TEMP}/drift.md"

      - name: Mirror the snapshot and re-pin the manifest
        if: steps.compare.outputs.needed == 'true'
        id: sync
        shell: bash
        env:
          UPSTREAM_DIR: ${{ steps.clone.outputs.dir }}
          UPSTREAM_SHA: ${{ steps.clone.outputs.sha }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          bun scripts/sync-official-docs.ts \
            --upstream "$UPSTREAM_DIR" \
            --upstream-sha "$UPSTREAM_SHA" \
            --upstream-branch "$UPSTREAM_BRANCH" \
            --pr-body "${RUNNER_TEMP}/pr-body.md" \
            --extra-section "${RUNNER_TEMP}/drift.md" \
            | tee "${RUNNER_TEMP}/sync-output.txt"
          cat "${RUNNER_TEMP}/sync-output.txt" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/sync-output.txt" >> "$GITHUB_STEP_SUMMARY"

      # The same command a human runs. A mirror that breaks the snapshot tests,
      # the TOC or the 95% official-docs floor must not reach a PR at all.
      - name: Quality gate
        if: steps.compare.outputs.needed == 'true'
        run: bun run check

      # add-paths keeps the commit to the snapshot: nothing the gate produced
      # (coverage output, an install-touched lockfile) can ride along.
      - name: Open or update the sync PR
        if: steps.compare.outputs.needed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ env.SYNC_BRANCH }}
          delete-branch: false
          # Pinned, not left to the action's default. The compare step decides
          # whether to hold back by asking which commits on the branch this
          # workflow did not make, so that identity is load-bearing here -- and
          # a default is someone else's to change. This is v8's current default
          # spelled out, so it changes nothing today.
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          # One line per bundled section (packages/official-docs/src/roots.ts
          # DOC_SECTIONS). A section missing here is mirrored by the sync step
          # and then silently dropped from the commit.
          add-paths: |
            docs/overview
            docs/guide
            docs/harness-engineering
            docs/reference
            docs/rfcs
            docs/official-docs.manifest.json
            docs/reviews
          title: "chore(docs): sync aidlc-workflows docs to ${{ steps.sync.outputs.version }}"
          commit-message: |
            chore(docs): sync aidlc-workflows docs to ${{ steps.sync.outputs.version }}

            Mirror awslabs/aidlc-workflows ${{ steps.upstream.outputs.branch }} (${{ steps.sync.outputs.sha }}).
            en tracks upstream; ja is left to the translation review.
          body-path: ${{ runner.temp }}/pr-body.md

      # release:patch ships the new pin: merging is what makes an installed
      # extension prompt its users to update their workspace. Patch is also the
      # default for an unlabelled merge, so this label is now explicitness
      # rather than the thing that causes the release -- a sync PR that must NOT
      # ship carries release:skip instead. Applied only when the PR is newly
      # opened -- the action's own `labels:` input re-applies on every update,
      # so a reviewer who swapped it for release:skip on an open sync PR would
      # silently get release:patch back on the next upstream move, and end up
      # with two contradictory labels. Editing it stays a decision that sticks.
      #
      # The exception is a State Version outside the set the extension supports
      # -- which is what `state-version-unsupported` actually tests, distinct
      # from a version string the check could not parse at all. That is a
      # safety override, not a preference, so it applies on an UPDATED PR too
      # (a pin that was fine when the PR opened can stop being fine on the next
      # upstream move) and it takes release:patch back off. Since patch is the
      # unlabelled default, failing to get release:skip on leaves a PR whose
      # merge ships a release that shows every installed extension
      # "unsupported" -- so that failure is fatal here, unlike the ordinary one.
      - name: Label the sync PR for release
        if: steps.compare.outputs.needed == 'true' && steps.pr.outputs.pull-request-number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
          PR_OPERATION: ${{ steps.pr.outputs.pull-request-operation }}
          STATE_VERSION_SUPPORTED: ${{ steps.drift.outputs.state_version_supported }}
          UPSTREAM_STATE_VERSION: ${{ steps.drift.outputs.upstream_state_version }}
          SUPPORTED_STATE_VERSIONS: ${{ steps.drift.outputs.supported_state_versions }}
          ANCESTRY: ${{ steps.ancestry.outputs.result }}
          # The step is continue-on-error, so its outputs are absent rather than
          # false when it failed. Read the outcome, not the outputs.
          DRIFT_OUTCOME: ${{ steps.drift.outcome }}
        run: |
          set -euo pipefail

          # Reasons a pin must not ship by merging alone. All end in
          # release:skip, so decide once and keep the handling in one place --
          # a second copy of the label dance is a second thing to get subtly
          # wrong.
          #
          # FAIL CLOSED. Mirroring and SHIPPING are separate decisions, and only
          # the first one fails open: a compatibility check that could not run
          # must not stop the mirror (the docs are useful on their own) but it
          # must not wave the pin through either. Nothing verified the State
          # Version, and since patch is the unlabelled default, "unknown" would
          # otherwise ship exactly like "verified fine". Worse, the check throws
          # precisely when upstream restructured -- no stage files, no agent
          # files, an unreadable version constant -- which is when compatibility
          # is most likely broken. The empty ANCESTRY case is the same rule: the
          # step always writes a result, so an empty one means something went
          # wrong rather than "nothing to worry about".
          reason=""
          if [ "$DRIFT_OUTCOME" != "success" ]; then
            reason="could not run the compatibility check, so nothing verified the State Version or the docs-bridge maps against this pin"
          elif [ "$STATE_VERSION_SUPPORTED" = "false" ]; then
            reason="pins State Version ${UPSTREAM_STATE_VERSION}, which is outside the set this extension supports (${SUPPORTED_STATE_VERSIONS})"
          fi
          case "$ANCESTRY" in
            ok | no-pin) ;;
            *) reason="${reason:+${reason}; and it }mirrors a branch the pinned revision is not behind (${ANCESTRY:-unknown})" ;;
          esac

          label() {
            for attempt in 1 2 3; do
              if gh pr edit "$PR_NUMBER" --add-label "$1"; then
                return 0
              fi
              echo "label attempt ${attempt} for $1 failed" >> "$GITHUB_STEP_SUMMARY"
              sleep $((attempt * 5))
            done
            return 1
          }

          if [ -n "$reason" ]; then
            # release:skip is documented by scripts/bump-extension-version.ts as
            # the opt-out but has never been created as a repository label, so
            # --add-label would fail on "label not found". Create it if missing;
            # no --force, so a colour or description someone chose is kept.
            gh label create release:skip \
              --color "B60205" \
              --description "Merge to main neither bumps the extension version nor publishes a release" \
              2>/dev/null || true
            if ! label release:skip; then
              echo "::error::PR #${PR_NUMBER} ${reason}, and release:skip could not be applied. Do NOT merge until it is labelled by hand."
              exit 1
            fi
            # Add first, remove second, deliberately: release-labels.yml refuses
            # a PR carrying release:skip AND a size label, so a half-applied
            # swap in this order blocks the merge, while the other order would
            # leave a bare release:patch that ships. Best-effort for the same
            # reason -- the PR may never have carried release:patch, and a
            # failure to remove one is not worth losing the skip label over.
            gh pr edit "$PR_NUMBER" --remove-label release:patch \
              || echo "release:patch was not present (or could not be removed)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::PR #${PR_NUMBER} labelled release:skip: it ${reason}. Resolve it on the branch, then relabel."
            exit 0
          fi

          # Only a run that CREATED the PR may label it (a rerun reads the pin
          # from the sync branch this run just pushed, decides no sync is
          # needed, and skips this step), so this is the one chance to get it
          # on. Failing no longer costs the release -- patch is the unlabelled
          # default -- so exhausting the retries warns and carries on.
          if [ "$PR_OPERATION" != "created" ]; then
            exit 0
          fi
          if ! label release:patch; then
            echo "::warning::could not label PR #${PR_NUMBER}; merging it still ships a patch release (the unlabelled default)"
          fi
