# Pre-merge guard for the release labels.
#
# bump-extension-version.yml decides on the post-merge push, which is too late
# for the one combination that cannot be undone by a red run: release:skip on a
# PR that also hand-writes the manifest version. release.yml runs on that same
# push, independently, gated on the version rather than any label — so it
# publishes while the bump workflow is still failing beside it. Refusing the PR
# is the only place that stops it.
#
# This runs the SAME decision the post-merge gate will run, against the same
# script, so the two can never disagree: `decide` exits non-zero on a conflict
# (release:skip with a hand-written version, or two size labels) and zero on
# every outcome that is allowed to merge. Nothing here is a second opinion.
#
# The step after it holds a PR-only rule with no post-merge twin: a minor or
# major release announces a feature, so its PR has to add the 更新情報 entry
# (packages/shared-types/src/whats-new.ts). `notes` exits non-zero unless the
# file at the PR head has an entry id that the merge base lacks; rewording an
# entry that already shipped does not count. A merged PR can no longer gain an
# entry, so this is the only place the rule can hold.
#
# Not part of `bun run check`: the inputs are the PR's labels and diff, which
# do not exist on a developer's machine. Both DECISIONS are unit-tested there
# (scripts/bump-extension-version.test.ts); this file only feeds them the PR.
#
# Make it a required check to actually block the merge; without that it is a
# visible red X and no more.
#
# NOT YET VERIFIED end-to-end: workflows take effect once they are on the
# default branch. Treat the first labelled PR after this lands as an
# acceptance check, for the 更新情報 step as much as for the label decision.
name: release-labels

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled matter as much as code pushes here: the verdict is a
    # function of the labels, so adding or removing one has to re-run it.
    # edited is what fires when a PR is retargeted onto main, which is the one
    # way a PR can arrive here having never been judged. It also fires on title
    # and body edits; those re-runs are wasted but the job is seconds long, and
    # gating them behind `if:` would report the check as skipped, which is a
    # worse thing to hand a branch-protection rule than a redundant pass.
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Job id is the check name a branch-protection rule has to name, so it says
  # what it guards rather than what it does internally.
  release-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR head, not the merge commit: the question is what this branch
          # did to the version. fetch-depth 0 for the merge-base below.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Run the merge-time release decision against this PR
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Read labels live rather than from the event payload: a re-run of an
          # older event would otherwise judge the PR by labels it no longer has.
          labels=$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}" \
            --jq '[.labels[].name] | join(",")')
          # Compare against the merge base, not the base tip. If main bumped
          # the version after this branch forked, the base tip differs from the
          # head through no doing of this PR, and that must not read as a
          # hand-written bump.
          git fetch --no-tags origin "$BASE_REF"
          merge_base=$(git merge-base "origin/${BASE_REF}" HEAD)
          previous=$(git show "${merge_base}:packages/vscode-extension/package.json" | jq -r .version)
          current=$(jq -r .version packages/vscode-extension/package.json)
          # The 更新情報 step below judges the same labels and merge base.
          {
            echo "labels=${labels}"
            echo "merge_base=${merge_base}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "labels=${labels:-<none>}"
            echo "merge-base=${merge_base}"
            echo "version: ${previous} -> ${current}"
          } >> "$GITHUB_STEP_SUMMARY"
          # decide exits 1 on a conflict and prints which one. Capture the
          # status before piping anything: in `cmd | tee`, the pipeline reports
          # tee's status, so piping first would swallow the refusal.
          set +e
          verdict=$(bun scripts/bump-extension-version.ts decide \
            --labels "$labels" \
            --current "$current" \
            --previous "$previous")
          status=$?
          set -e
          printf '%s\n' "$verdict" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::this PR's release labels contradict its diff; see the job summary"
            exit 1
          fi

      - name: Require an 更新情報 entry on a minor or major release
        shell: bash
        env:
          LABELS: ${{ steps.release.outputs.labels }}
          MERGE_BASE: ${{ steps.release.outputs.merge_base }}
        run: |
          set -euo pipefail
          # The entries as they were at the merge base above, so an entry main
          # gained after this branch forked is not counted as this PR's. Before
          # the file existed there, the base has no entries.
          entries=packages/shared-types/src/whats-new.ts
          base="${RUNNER_TEMP}/whats-new.base.ts"
          if git cat-file -e "${MERGE_BASE}:${entries}" 2>/dev/null; then
            git show "${MERGE_BASE}:${entries}" > "$base"
          else
            : > "$base"
          fi
          set +e
          verdict=$(bun scripts/bump-extension-version.ts notes \
            --labels "$LABELS" \
            --base "$base" \
            --head "$entries")
          status=$?
          set -e
          printf '%s\n' "$verdict" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::a release:minor or release:major PR adds a new 更新情報 entry (a new id) to packages/shared-types/src/whats-new.ts; see docs/maintenance/release-and-sync.md (更新情報を書く)"
            exit 1
          fi
