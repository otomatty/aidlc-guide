# Automatic version bump: EVERY push to main writes the next semver into
# packages/vscode-extension/package.json and pushes that commit to main. The
# release labels only choose the size of the bump:
#
#   release:major / release:minor / release:patch -> that level
#   no release label                              -> patch (the default)
#   release:skip                                  -> no bump, no release
#
# Shipping is the default because a merge nobody released is invisible to
# installed extensions. Opting out is explicit (release:skip) so it is a
# decision on the PR rather than the silent result of forgetting a label.
#
# The existing release.yml still owns publishing. This workflow writes the
# version-changing commit and then calls release.yml against that SHA:
# GITHUB_TOKEN pushes do not start a new workflow run.
# A merge that already changed the manifest version is a no-op — the
# manual bump path in the README stays valid, and merging plus bumping
# must not increment twice. That same already-bumped gate is what keeps this
# workflow off its own bump commit if a future token ever did re-trigger runs.
#
# Apply re-reads latest main rather than the version decide saw. Two labelled
# PRs that land back-to-back must become 0.2.1 then 0.2.2, not two writers
# of 0.2.1. The lock is therefore a single group on main, not per-tag.
#
# The bump commit itself is a direct push. GITHUB_TOKEN pushes start no run,
# and were that ever to change, decide reads previous != current on it and
# skips as already-bumped — no loop. No [skip ci] either (that would also
# skip release.yml).
#
# NOT YET VERIFIED end-to-end: workflows only take effect once they are on
# the default branch. Treat the first merge after this lands as an
# acceptance check. If main is protected against direct pushes, allow
# github-actions[bot] to push those two files or the push job will fail loud.
#
# Privilege split matches release.yml: the job that runs bun (apply) is
# contents: read and persist-credentials: false. The job that holds
# contents: write (push) never runs bun or any other file from the
# repository. It patches .version on the fetched tip and copies the
# lockfile only when that tip still matches apply's base. A labelled PR
# can replace scripts/bump-extension-version.ts, but that code never sees
# a write token.
name: bump-extension-version

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# Serialise bumps on main. cancel-in-progress: false keeps a running bump
# alive; queue: max keeps the rest in FIFO order. Without the queue, GitHub
# retains only one pending run per group and a third labelled merge cancels
# the second — the same trap release.yml documents and refuses to take.
concurrency:
  group: bump-extension-version-main
  cancel-in-progress: false
  queue: max

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      action: ${{ steps.gate.outputs.action }}
      level: ${{ steps.gate.outputs.level }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Need HEAD plus enough history to resolve github.event.before
          # (the pre-push tip of main). fetch-depth: 2 is enough for a
          # squash-merge; a multi-commit push fetches `before` below.
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Decide whether this push should bump
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current=$(jq -r .version packages/vscode-extension/package.json)
          # Compare against the tip of main *before this push*, not HEAD^.
          # HEAD^ is only the pre-PR tip for a single-commit squash-merge;
          # a rebase-merge or a multi-commit push would miss a version bump
          # that landed in an earlier commit of the same push and double-increment.
          base="$BEFORE_SHA"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${GITHUB_SHA}^"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "$base"
          fi
          previous=$(git show "${base}:packages/vscode-extension/package.json" | jq -r .version)
          # Reading a PR's labels wrong is not harmless: with patch as the
          # default, a release:skip we fail to see ships the release the PR
          # asked not to. So try three independent sources before concluding
          # there was no PR at all.
          #   1. the commit→PR index, which can lag a merge by a few seconds
          #   2. the subject: "(#123)" on a squash, "Merge pull request #123"
          #      on a merge commit (that form carries no parenthesised number)
          #   3. the PR records themselves, matched on merge_commit_sha — set
          #      on the PR at merge time, so it does not depend on either the
          #      commit index or on the subject still naming the number
          # A gh api failure aborts the step under set -e rather than reading
          # as "no labels": an API error must not ship an unwanted release.
          labels=""
          resolved=""
          pr_num=""
          pr_count=0
          for _attempt in 1 2 3 4 5 6; do
            payload=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls")
            pr_count=$(jq '[.[] | select(.base.ref == "main")] | length' <<<"$payload")
            labels=$(jq -r '[.[] | select(.base.ref == "main") | .labels[].name] | unique | join(",")' <<<"$payload")
            if [ "$pr_count" != "0" ]; then
              resolved="commit-index"
              break
            fi
            sleep 3
          done
          if [ -z "$resolved" ]; then
            subject=$(git log -1 --format=%s "$GITHUB_SHA")
            # GitHub's squash subject is "{title} (#N)". The title may itself
            # contain (#M); the last match is the merged PR.
            rest="$subject"
            while [[ "$rest" =~ \(#([0-9]+)\) ]]; do
              pr_num="${BASH_REMATCH[1]}"
              rest="${rest#*"${BASH_REMATCH[0]}"}"
            done
            if [ -z "$pr_num" ] && [[ "$subject" =~ ^Merge\ pull\ request\ \#([0-9]+)( |$) ]]; then
              pr_num="${BASH_REMATCH[1]}"
            fi
            [ -n "$pr_num" ] && resolved="subject"
          fi
          if [ -z "$resolved" ]; then
            # Survives an edited squash title: merge_commit_sha is recorded on
            # the PR, not derived from the message. Newest closed PRs first, so
            # a merge that just landed is on the first page.
            pr_num=$(gh api "repos/${GH_REPO}/pulls?state=closed&base=main&sort=updated&direction=desc&per_page=100" \
              | jq -r --arg sha "$GITHUB_SHA" \
                  '[.[] | select(.merge_commit_sha == $sha) | .number] | first // empty')
            [ -n "$pr_num" ] && resolved="merge-commit-sha"
          fi
          if [ -n "$pr_num" ] && [ "$resolved" != "commit-index" ]; then
            labels=$(gh api "repos/${GH_REPO}/pulls/${pr_num}" \
              --jq '[.labels[].name] | join(",")')
            resolved="${resolved}-#${pr_num}"
          fi
          if [ -z "$resolved" ]; then
            # None of the three found a PR. A direct push to main is the
            # ordinary way to land here and never carried a label to miss, so
            # the unlabelled default applies — said out loud because it is also
            # where a merge would land if all three somehow came back empty.
            resolved="no-pr"
            echo "::warning::no pull request found for ${GITHUB_SHA} by commit index, subject, or merge_commit_sha; treating it as a direct push and applying the unlabelled default"
          fi
          {
            bun scripts/bump-extension-version.ts decide \
              --labels "$labels" \
              --current "$current" \
              --previous "$previous"
          } | tee /tmp/bump-decide.txt
          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_OUTPUT"
          done < /tmp/bump-decide.txt
          echo "labels=${labels:-<none>} (via ${resolved}) current=${current} previous=${previous}" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/bump-decide.txt >> "$GITHUB_STEP_SUMMARY"

  # Read-only: may run scripts/bump-extension-version.ts from latest main.
  # A labelled PR can replace that file; it must not see a write token.
  apply:
    needs: decide
    if: needs.decide.outputs.action == 'bump'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.work.outputs.reused }}
      sha: ${{ steps.work.outputs.sha }}
      from: ${{ steps.work.outputs.from }}
      next: ${{ steps.work.outputs.next }}
    permissions:
      contents: read
    steps:
      # Latest main, not this workflow's triggering SHA: a bump that waited
      # behind another labelled merge must increment what that merge wrote.
      - uses: actions/checkout@v4
        with:
          ref: main
          # Default depth is 1. The Source-Commit search walks
          # GITHUB_SHA..origin/main; a shallow fetch of the tip cannot see
          # a bump that is no longer HEAD after later merges.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - name: Apply the extension version bump
        id: work
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LEVEL: ${{ needs.decide.outputs.level }}
        run: |
          set -euo pipefail
          # persist-credentials: false dropped the checkout token. Re-auth
          # only for fetch, using the same basic extraheader checkout writes.
          # This job's token is contents: read.
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          auth_git() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" "$@"
          }

          auth_git fetch origin main
          if ! git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
            auth_git fetch origin "$GITHUB_SHA"
          fi

          # Reuse only a bump whose Source-Commit trailer is this event's
          # GITHUB_SHA. A later PR's bump also sits in GITHUB_SHA..main and
          # must not satisfy this retry.
          existing_bump() {
            while read -r hash; do
              subject=$(git show -s --format=%s "$hash")
              case "$subject" in
                "chore: bump extension to "*)
                  if git show -s --format=%B "$hash" | grep -Fxq "Source-Commit: ${GITHUB_SHA}"; then
                    printf '%s' "$hash"
                    return 0
                  fi
                  ;;
              esac
            done < <(git rev-list --first-parent "${GITHUB_SHA}..origin/main")
            return 1
          }

          if existing=$(existing_bump); then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "sha=${existing}" >> "$GITHUB_OUTPUT"
            echo "reusing existing bump ${existing}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git reset --hard origin/main
          from=$(jq -r .version packages/vscode-extension/package.json)
          if [ -z "$from" ] || [ "$from" = "null" ]; then
            echo "::error::could not read the extension version on main"
            exit 1
          fi
          mkdir -p /tmp/extension-version-bump-out
          # Push compares this snapshot to the tip's lockfile. A later merge
          # that changed dependencies must not receive this run's lockfile.
          cp bun.lock /tmp/extension-version-bump-out/bun.lock.base
          next=$(bun scripts/bump-extension-version.ts apply \
            --manifest packages/vscode-extension/package.json \
            --level "$LEVEL")
          # bun.lock records the workspace package version (currently
          # packages/vscode-extension @ 0.2.0). Leaving it stale makes
          # the next bun install rewrite the lockfile, and can fail
          # release.yml's bun install --frozen-lockfile.
          bun install --ignore-scripts
          if git diff --quiet -- packages/vscode-extension/package.json bun.lock; then
            echo "::error::apply --level ${LEVEL} did not change the manifest"
            exit 1
          fi
          cp bun.lock /tmp/extension-version-bump-out/bun.lock
          echo "reused=false" >> "$GITHUB_OUTPUT"
          echo "from=${from}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "applied ${from} -> ${next} (${LEVEL})" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.work.outputs.reused != 'true'
        with:
          name: extension-version-bump-${{ github.sha }}
          path: /tmp/extension-version-bump-out
          if-no-files-found: error
          retention-days: 1

  # Write token, no project code. Patches .version on the fetched tip and
  # copies the lockfile only when that tip still matches apply's base.
  # Re-running bun here would hand the write token to project code.
  push:
    needs: [decide, apply]
    if: needs.decide.outputs.action == 'bump'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        if: needs.apply.outputs.reused != 'true'
        with:
          name: extension-version-bump-${{ github.sha }}
          path: /tmp/extension-version-bump

      - name: Commit the bumped manifest and push
        id: commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REUSED: ${{ needs.apply.outputs.reused }}
          REUSED_SHA: ${{ needs.apply.outputs.sha }}
          FROM: ${{ needs.apply.outputs.from }}
          NEXT: ${{ needs.apply.outputs.next }}
        run: |
          set -euo pipefail
          if [ "${REUSED}" = "true" ]; then
            if [ -z "${REUSED_SHA}" ]; then
              echo "::error::apply reused but produced no SHA"
              exit 1
            fi
            echo "sha=${REUSED_SHA}" >> "$GITHUB_OUTPUT"
            echo "reusing existing bump ${REUSED_SHA}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${FROM}" ] || [ -z "${NEXT}" ]; then
            echo "::error::apply did not output from/next"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # persist-credentials: false; auth only on the git commands below.
          # Do not persist the write token into .git/config. Same basic
          # extraheader checkout uses (bearer is not accepted on git HTTPS).
          basic_auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          auth_git() {
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${basic_auth}" "$@"
          }

          if ! git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
            auth_git fetch origin "$GITHUB_SHA"
          fi

          existing_bump() {
            while read -r hash; do
              subject=$(git show -s --format=%s "$hash")
              case "$subject" in
                "chore: bump extension to "*)
                  if git show -s --format=%B "$hash" | grep -Fxq "Source-Commit: ${GITHUB_SHA}"; then
                    printf '%s' "$hash"
                    return 0
                  fi
                  ;;
              esac
            done < <(git rev-list --first-parent "${GITHUB_SHA}..origin/main")
            return 1
          }

          lock_src="/tmp/extension-version-bump/bun.lock"
          lock_base="/tmp/extension-version-bump/bun.lock.base"
          test -f "$lock_src"
          test -f "$lock_base"

          sha=""
          for attempt in 1 2 3; do
            auth_git fetch origin main
            if existing=$(existing_bump); then
              sha="$existing"
              echo "reusing existing bump ${sha}" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            git reset --hard origin/main
            tip=$(jq -r .version packages/vscode-extension/package.json)
            if [ "$tip" = "$NEXT" ]; then
              sha=$(git rev-parse HEAD)
              echo "main already at ${NEXT}; releasing ${sha}" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$tip" != "$FROM" ]; then
              echo "::error::main moved from ${FROM} to ${tip}; refusing to write ${NEXT}"
              exit 1
            fi
            # Version only: a concurrent merge may have changed other
            # manifest fields and those must stay. jq is a runner tool,
            # not repository code.
            tmp=$(mktemp)
            jq --arg v "$NEXT" '.version = $v' packages/vscode-extension/package.json > "$tmp"
            mv "$tmp" packages/vscode-extension/package.json
            if cmp -s bun.lock "$lock_base"; then
              cp "$lock_src" bun.lock
            else
              echo "::error::bun.lock changed on main after apply; refusing to replace it"
              exit 1
            fi
            git add packages/vscode-extension/package.json bun.lock
            if git diff --cached --quiet; then
              echo "::error::version patch did not change the manifest or lockfile"
              exit 1
            fi
            git commit -m "chore: bump extension to ${NEXT}" \
              -m "Source-Commit: ${GITHUB_SHA}"
            if auth_git push origin HEAD:main; then
              sha=$(git rev-parse HEAD)
              break
            fi
            auth_git fetch origin main
            if existing=$(existing_bump); then
              sha="$existing"
              echo "push failed but ${sha} already on main" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::push to main failed after ${attempt} attempts"
              exit 1
            fi
          done
          if [ -z "$sha" ]; then
            echo "::error::bump produced no commit SHA"
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "bumped to ${NEXT} at ${sha}" >> "$GITHUB_STEP_SUMMARY"

  # GITHUB_TOKEN pushes do not start new workflow runs, so the labelled path
  # has to invoke release.yml itself against the bump commit. A manual version
  # bump inside the PR still rides the ordinary push trigger.
  release:
    needs: [decide, apply, push]
    if: needs.decide.outputs.action == 'bump'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.push.outputs.sha }}
    permissions:
      contents: write
      pull-requests: read
