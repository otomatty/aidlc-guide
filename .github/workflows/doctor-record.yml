# For a maintainer whose environment cannot download artifacts: the recording
# step of docs/maintenance/release-and-sync.md. Dispatch it on a work branch,
# never main. It captures through doctor-contract.yml and commits the checked
# captures to that branch.
#
# This lives apart from doctor-contract.yml on purpose. A reusable workflow
# may not contain a job that asks for more token scope than its caller grants,
# even a job that would be skipped: aidlc-workflows-update.yml calls
# doctor-contract.yml with contents: read, and a contents: write job there made
# every scheduled sync fail at startup. `bun run lint:workflows` now rejects
# that shape (scripts/ci-workflow-policy.ts).
name: doctor-record

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    uses: ./.github/workflows/doctor-contract.yml

  # No upstream executable runs in this job; it reads the captured text, and
  # record-doctor-candidate.ts refuses any capture that does not pass the same
  # checks as the capture job. It runs after a failed capture leg on purpose
  # (that leg fails when fresh captures differ from the recorded ones, which is
  # what a re-record replaces); --all-platforms refuses the run unless all
  # three OS uploaded a checked capture.
  record:
    needs: capture
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: doctor-record-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: doctor-*
          path: logs/doctor-captures
      - name: Record the captures as the reviewed release's evidence
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          version=$(jq -r .sourceVersion docs/official-docs.manifest.json)
          bun scripts/record-doctor-candidate.ts --all-platforms "$version" logs/doctor-captures/*
          bun x --no-install oxfmt packages/vscode-extension/data/doctor-compatibility.json
          git add -- packages/vscode-extension/data/doctor-compatibility.json packages/vscode-extension/tests/fixtures/doctor/captured
          if git diff --cached --quiet; then
            echo 'Nothing new to record.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(doctor): record aidlc-workflows $version captures (run $RUN_ID)"
          git push origin "HEAD:refs/heads/$BRANCH"
