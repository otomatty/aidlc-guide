# The single quality gate, run on a machine that is not the author's.
#
# This mirrors `bun run check` exactly — it does not add, reorder or relax a
# step. If the two ever disagree, the local command is the source of truth
# (team.md: the local gate is the gate) and this file is the thing to fix.
#
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Both OS families are supported and there is no CI to catch a
    # Windows-only path bug otherwise, so both run. macOS is included
    # specifically because no macOS run has happened by hand yet (MA-7).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      # Windows runners default to core.autocrlf=true, which rewrites the
      # working tree to CRLF and fails Biome's LF format check. Pin LF before
      # checkout; .gitattributes (eol=lf) is the durable source of truth.
      - name: Prefer LF line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      # --frozen-lockfile, not install: a lockfile that drifts from the
      # committed one is a gate failure, not something to resolve silently.
      - run: bun install --frozen-lockfile

      # No env: the gate carries its own preconditions. The live-workspace
      # suites elect an intent record through scripts/live-intent.ts, so a
      # fresh clone here runs exactly what a fresh clone runs anywhere.
      - run: bun run check
